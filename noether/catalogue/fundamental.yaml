- basedimension: time
  symbol: T
- basedimension: length
  symbol: L
- basedimension: mass
  symbol: M
- basedimension: current
  symbol: I
- basedimension: temperature
  symbol: Θ
- basedimension: substance
  symbol: N
- basedimension: luminosity
  symbol: J


- unitset: SI base units
  info: Fundamental SI dimensions and their units.
  url: https://www.bipm.org/documents/20126/41483022/SI-Brochure-9.pdf/fcf090b2-04e6-88cc-1149-c3e029ad8232

  units:
  - unit: time
    names: second, 's'
    p: SI

  - unit: length
    names: meter, metre, 'm'
    p: SI

  - unit: mass
    names: kilogram, 'kg'
    p: SI

  - unit: current
    names: ampere, 'A'
    p: SI

  - unit: temperature
    names: kelvin, 'K'
    p: SI

  - unit: substance
    names: mole, 'mol'
    p: SI

  - unit: luminosity
    names: candela, 'cd'
    p: SI
