- unitset: MTS
  url: https://en.wikipedia.org/wiki/MTS_units
  i: |
    Meter-tonne-second units.
    Similar in nature to SI and CGS.
    Once used in France and the Soviet Union.
  units:

  - unit: m**3
    names: stere, stère, 'st'
    i: Used in firewood measurement
    origin: Greek stereós, 'solid'

  - unit: t*m/s**2
    names: sthene, sthène, sthéne, 'sn'
    origin: Greek sthénos, 'force'

  - unit: sthene / m**2
    names: pieze, pièze, 'pz'