- unitset: ancient greek
  url: https://en.wikipedia.org/wiki/Ancient_Greek_units_of_measurement
  info: |
    All units of length are based on an Attic measurement
    (pous = 296mm).
  units:
  - unit: 0.296m
    names: pous, πούς
    info: Ancient greek foot, as defined in Athens (though varying regionally)

# daktylos

  - unit: pous / 16
    names: daktylos, δάκτυλος
    origin: finger

  - unit: 2 daktylos
    names: kondylos, κόνδυλος
    origin: knuckle

  - unit: 4 daktylos
    names: palaiste, palaistē, παλαιστή, doron, dōron, δῶρον
    origin: palm

  - unit: 8 daktylos
    names: dichas, διχάς, hemipodion, hēmipodion, ἡμιπόδιον
    origin: half-foot

  - unit: 10 daktylos
    names: lichas, λιχάς
    origin: distance from tip of thumb to tip of outstretched index finger

  - unit: 11 daktylos
    names: orthodoron, orthodōron, ὀρθόδωρον
    origin: width of a straight hand

  - unit: 12 daktylos
    names: spithame, spithamē, σπιθαμή
    origin: span of all fingers

  - unit: 18 daktylos
    names: pygme, pygmē, πυγμή
    origin: forearm

  - unit: 20 daktylos
    names: pygon, pygōn, πυγών
    origin: elbow to fist

  - unit: 24 daktylos
    names: pechys, pēchys, πῆχυς
    origin: cubit (elbow to tip of hand)

# pous

  - unit: 2.5 pous
    names: haploun_bema, haploun_bēma, ἁπλοῦν_βῆμα
    origin: step

  - unit: 5 pous
    names: diploun_bema, diploun_bēma, διπλοῦν_βῆμα, bema, bēma, βῆμα
    origin: pace

  - unit: 6 pous
    names: orgyia, ὄργυια
    origin: fathom

  - unit: 10 pous
    names: kalamos, κάλαμος, akaina, ἄκαινα, dekapous, δεκάπους

  - unit: 60 pous
    names: hamma, ἅμμα
    origin: knot

  - unit: 100 pous
    names: plethron, πλέθρον
    info: typical length of an athletic running-track

  - unit: 600 pous
    names: stadion, στάδιον
    info: one eighth of a Roman mile

# stadion

  - unit: 2 stadion
    names: diaulos, δίαυλος
    info: ancient Olympic racing distance

  - unit: 4 stadion
    names: hippikon, ἱππικόν
    info: length of a hippodrome (horse racing stadium)

  - unit: 8 stadion
    names: milion, μίλιον
    info: equivalent of a modern mile

  - unit: 12 stadion
    names: dolichos, δόλιχος
    info: ancient Olympic "long race"

  - unit: 30 stadion
    names: parasanges, παρασάγγης
    info: Equivalent of a modern eague; used to measure walking distance

  - unit: 40 stadion
    names: schoinos, σχοινός
    origin: Adopted from an Egyptian unit of surveying with knotted cords

  - unit: 160 stadion
    names: stage
